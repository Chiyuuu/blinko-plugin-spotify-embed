<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置面板 · Spotify 音乐卡片</title>
<style>
  :root { color-scheme: light; }
  html.dark { color-scheme: dark; }
  body {
    margin: 0; padding: 28px 20px;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f7f8; color: #18181b;
  }
  html.dark body { background: #0d0d0f; color: #e8e8ea; }
  .panel {
    max-width: 560px; margin: 0 auto; padding: 18px;
    background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 14px;
  }
  html.dark .panel { background: #141417; border-color: rgba(255,255,255,.08); }
  .hint { max-width: 560px; margin: 12px auto 0; font-size: 12px; color: #8a8a93; }
</style>
</head>
<body>
<div class="panel" id="host"></div>
<div class="hint">这是插件 <code>renderSettingPanel()</code> 的真实输出，Blinko 会把它放进插件设置弹窗里。</div>

<script>
  window.__pluginClass = null;
  window.System = {
    register: function (deps, declare) {
      var exported = {};
      var ctx = declare(function (name, value) { exported[name] = value; });
      if (ctx && typeof ctx.execute === 'function') ctx.execute();
      window.__pluginClass = exported['default'];
    }
  };
</script>
<script src="../release/index.js"></script>
<script src="./mock-i18n.js"></script>
<script>
  var mockConfig = { showHeader: true, lazy: true, hideNative: true, maxWidth: 620 };
  window.Blinko = {
    api: { config: {
      getPluginConfig: { query: function () { return Promise.resolve(Object.assign({}, mockConfig)); } },
      setPluginConfig: { mutate: function (args) { mockConfig[args.key] = args.value; return Promise.resolve({}); } }
    }},
    i18n: window.BS_MOCK_I18N,
    toast: { success: function (m) { console.log('[toast]', m); }, error: console.warn },
    closeDialog: function () {}
  };

  var plugin = new window.__pluginClass();
  plugin.init();
  document.getElementById('host').appendChild(plugin.renderSettingPanel());

  if (new URLSearchParams(location.search).get('theme') === 'dark') {
    document.documentElement.classList.add('dark');
  }
</script>
</body>
</html>
